name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Generate artwork (needed to build)
        shell: powershell
        run: .\scripts\fetch-assets.ps1

      - name: Build
        shell: powershell
        run: |
          $sdk = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Include" -Directory |
            Where-Object Name -Match '^10\.0\.\d+\.0$' | Sort-Object { [version]$_.Name } | Select-Object -Last 1
          msbuild DeltaCard\DeltaCard.csproj -restore -p:Configuration=Release -p:Platform=x64 `
            -p:AppxBundle=Never -p:TargetPlatformVersion=$($sdk.Name) -v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Assemble package
        shell: powershell
        run: |
          $name = "DeltaCardWidget-${{ github.ref_name }}"
          $dist = "dist\$name"
          $msix = Get-ChildItem DeltaCard\AppPackages -Recurse -Filter *.msix | Select-Object -First 1
          $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\makeappx.exe" |
            Sort-Object FullName | Select-Object -Last 1
          New-Item -ItemType Directory -Force "$dist\dependencies" | Out-Null
          & $makeappx.FullName unpack /p $msix.FullName /d "$dist\package" /nv /o
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Copy-Item "$($msix.DirectoryName)\Dependencies\x64\*.appx" "$dist\dependencies"
          Copy-Item scripts\install-release.ps1 "$dist\Install.ps1"
          Copy-Item README.md $dist
          Compress-Archive -Path $dist -DestinationPath "dist\$name.zip"

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*.zip
          generate_release_notes: true
          body: |
            **Install / 安装**: unzip to a permanent folder, enable Developer Mode, then run `Install.ps1` in PowerShell.
            解压到固定位置，开启开发人员模式，然后在 PowerShell 中运行 `Install.ps1`。

      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: DeltaCardWidget
          path: dist/*.zip
