name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Build
        shell: powershell
        run: |
          $sdk = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Include" -Directory |
            Where-Object Name -Match '^10\.0\.\d+\.0$' | Sort-Object { [version]$_.Name } | Select-Object -Last 1
          msbuild DeltaCard\DeltaCard.csproj -restore -p:Configuration=Release -p:Platform=x64 `
            -p:AppxBundle=Never -p:TargetPlatformVersion=$($sdk.Name) -v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Assemble package
        shell: powershell
        run: |
          $name = "DeltaCardWidget-${{ github.ref_name }}"
          $dist = "dist\$name"
          $msix = Get-ChildItem DeltaCard\AppPackages -Recurse -Filter *.msix | Select-Object -First 1
          $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\makeappx.exe" |
            Sort-Object FullName | Select-Object -Last 1
          New-Item -ItemType Directory -Force "$dist\dependencies" | Out-Null
          & $makeappx.FullName unpack /p $msix.FullName /d "$dist\package" /nv /o
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Copy-Item "$($msix.DirectoryName)\Dependencies\x64\*.appx" "$dist\dependencies"
          Copy-Item scripts\install-release.ps1 "$dist\Install.ps1"
          Copy-Item scripts\uninstall-release.ps1 "$dist\Uninstall.ps1"
          Copy-Item README.md $dist

          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $makensis = Get-ChildItem "${env:ProgramFiles(x86)}\NSIS\makensis.exe", `
            "$env:ProgramFiles\NSIS\makensis.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $makensis) { throw 'NSIS makensis.exe was not found.' }
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0' }
          $output = Join-Path (Resolve-Path dist).Path "$name-Setup.exe"
          $script = (Resolve-Path installer\DeltaCardWidget.nsi).Path
          & $makensis.FullName "/DPRODUCT_VERSION=$version" `
            "/DPAYLOAD_DIR=$((Resolve-Path $dist).Path)" "/DOUTPUT_EXE=$output" `
            $script
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*-Setup.exe
          generate_release_notes: true
          body: |
            **Install / 安装**: download and run the single-file installer. Developer Mode must be enabled.
            下载并运行单文件安装器。需要先开启开发人员模式。

      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: DeltaCardWidget
          path: dist/*-Setup.exe
